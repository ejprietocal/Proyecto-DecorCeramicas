# Construye la imagen Docker (nginx + sitio estático), la publica en GHCR
# y dispara el despliegue en Easypanel mediante su URL de Deployment Trigger.
name: Desplegar en Easypanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dos despliegues simultáneos; el más reciente cancela al anterior
concurrency:
  group: despliegue-easypanel
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # GHCR exige el nombre de la imagen en minúsculas
  IMAGEN: ghcr.io/ejprietocal/proyecto-decorceramicas

jobs:
  construir-y-desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disparar despliegue en Easypanel
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then
            echo "::error::Falta el secret EASYPANEL_DEPLOY_URL (Easypanel > servicio > Deployments > Deployment Trigger)"
            exit 1
          fi
          # Se intenta POST y, si el endpoint no lo acepta, GET
          curl -fsS --retry 3 --retry-delay 5 -X POST "$EASYPANEL_DEPLOY_URL" \
            || curl -fsS --retry 3 --retry-delay 5 "$EASYPANEL_DEPLOY_URL"
          echo "Despliegue solicitado: ${{ env.IMAGEN }}:latest (commit ${GITHUB_SHA::7})"
